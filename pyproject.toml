[project]
name = "auto-rob2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.9",
    "faiss-cpu>=1.8",
    "langchain-anthropic>=0.3.20",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-openai>=0.3.16",
    "langchain-openrouter>=0.2.3",
    "langgraph>=1.1.10",
    "pydantic>=2.13.3",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=3.0",
    "tenacity>=9.1.4",
]

[project.scripts]
rob2-workspace = "rob2_pipeline.trial_workspace_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rob2_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "ty>=0.0.42",
]
